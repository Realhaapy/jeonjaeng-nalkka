name: Encrypted official source relay
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main, ops/source-relay-20261107]
    paths: ['.ops/relay/**', '.github/workflows/source-relay.yml']

permissions:
  contents: write

concurrency:
  group: official-source-relay
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r .ops/relay/requirements.txt
      - name: Verify encryption and retention gates offline
        working-directory: .ops/relay
        run: python -m unittest discover -s tests -q
      - name: Collect and encrypt official source results
        working-directory: .ops/relay
        env:
          RELAY_OUTPUT: ${{ runner.temp }}/official-source-relay.json
        run: python scripts/source-relay-collect.py --config config/sources.json --public-key public-key.json --output "$RELAY_OUTPUT"
      - name: Publish encrypted envelope on dedicated branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_OUTPUT: ${{ runner.temp }}/official-source-relay.json
        run: python .ops/relay/scripts/source-relay-publish.py --envelope "$RELAY_OUTPUT"
