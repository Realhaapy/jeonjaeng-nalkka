name: Publish static briefing
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages-artifact-recovery-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://war.pebbleroom.kr/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify public entry point
        run: test -f public/index.html && test -f public/latest.json
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy by uploaded artifact ID
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_COMMIT: ${{ github.sha }}
        with:
          script: await require('./.github/scripts/deploy-pages-by-id.cjs')({ github, context, core });

